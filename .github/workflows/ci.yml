name: Local quality gates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.9
      - run: npm ci
        env:
          DATABASE_URL: postgresql://local_only@127.0.0.1:5432/emprestai_test
          DIRECT_URL: postgresql://local_only@127.0.0.1:5432/emprestai_test
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.9
      - run: npm ci
        env:
          DATABASE_URL: postgresql://local_only@127.0.0.1:5432/emprestai_test
          DIRECT_URL: postgresql://local_only@127.0.0.1:5432/emprestai_test
      - run: npm run test:integration
# Sem segredos Supabase/Vercel. Nenhum job aplica migrations ou dados em produção.
# O launcher de revisão sem rede exige macOS sandbox-exec; não há fallback inseguro no Ubuntu.
